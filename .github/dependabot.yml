version: 2
updates:
  # Python runtime/dev dependencies declared in pyproject.toml.
  - package-ecosystem: pip
    directory: "/"
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    labels:
      - dependencies
      - security
    commit-message:
      prefix: "deps"
    groups:
      # One PR per week for routine patch/minor bumps; majors stay separate.
      python-minor-patch:
        update-types:
          - minor
          - patch

  # Pinned GitHub Actions (SHA + version comment) — Dependabot bumps the SHA and
  # the trailing version comment together, keeping the supply-chain pins current.
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    labels:
      - dependencies
      - ci
    commit-message:
      prefix: "ci"
