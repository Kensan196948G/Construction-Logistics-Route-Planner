[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "construction-logistics-route-planner"
version = "0.1.0"
description = "Initial route risk review MVP for construction logistics planning."
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.111",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.7",
    "sqlalchemy[asyncio]>=2.0",
    "aiosqlite>=0.20",
    "alembic>=1.13",
    "httpx>=0.27",
    "reportlab>=4.2",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2",
    "pytest-asyncio>=0.24",
    "ruff>=0.6",
    "bandit>=1.7",
    "python-jose[cryptography]>=3.3",
    "cryptography>=42",
]
pg = [
    "asyncpg>=0.29",
    "psycopg2-binary>=2.9",
]

# Explicit package list so `pip install .` is deterministic (the repo also has a
# non-package `tests/` dir, which flat-layout auto-discovery would choke on).
[tool.setuptools]
packages = ["app"]

[tool.setuptools.package-data]
# Recursive glob: a single-level "static/*" silently drops the vendored
# Leaflet tree (static/vendor/leaflet/**), breaking the map on `pip install .`
# deployments (Docker). "**/*" keeps every static asset in the wheel/sdist.
app = ["static/**/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"
asyncio_default_fixture_loop_scope = "function"
