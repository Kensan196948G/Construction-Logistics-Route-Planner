<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Construction Logistics Route Planner</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700&family=Space+Grotesk:wght@500;600;700&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/assets/vendor/leaflet/leaflet.css" />
  <link rel="stylesheet" href="/assets/styles.css" />
</head>
<body>
  <div id="app"></div>
  <template id="app-template">
<div style="display:flex; height:100vh; width:100%; background:#e9e6df; color:#14171a; overflow:hidden; font-family:'Noto Sans JP',system-ui,sans-serif;">

  <aside style="width:248px; flex:none; background:#15181c; border-right:1px solid #2a2f36; display:flex; flex-direction:column; color:#c4cad3;">
    <div style="padding:18px 18px 15px; border-bottom:1px solid #23282f; display:flex; align-items:center; gap:11px;">
      <div style="width:34px; height:34px; flex:none; background:#ff6a00; border-radius:7px; display:flex; align-items:center; justify-content:center;">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none"><path d="M5 18 L10 6 L14 16 L19 5" stroke="#15181c" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/><circle cx="5" cy="18" r="2.4" fill="#15181c"/><circle cx="19" cy="5" r="2.4" fill="#15181c"/></svg>
      </div>
      <div>
        <div style="font-weight:700; font-size:14px; color:#fff; letter-spacing:.01em;">Route Planner</div>
        <div style="font-size:10.5px; color:#7a828d; letter-spacing:.03em;">搬入ルート検討支援</div>
      </div>
    </div>

    <nav style="padding:10px 0; flex:1; overflow-y:auto;">
      <div style="padding:9px 18px 7px; font-size:10.5px; font-weight:700; letter-spacing:.12em; color:#5c636d;">検討フロー</div>

      <button onClick="{{ nav.dashboard.go }}" style="display:flex; align-items:center; gap:11px; width:100%; padding:10px 18px; border:none; cursor:pointer; font:inherit; font-size:13.5px; font-weight:600; text-align:left; background:{{ nav.dashboard.bg }}; color:{{ nav.dashboard.fg }}; box-shadow:inset 3px 0 0 {{ nav.dashboard.bar }};">
        <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/></svg>
        ダッシュボード
      </button>
      <button onClick="{{ nav.project.go }}" style="display:flex; align-items:center; gap:11px; width:100%; padding:10px 18px; border:none; cursor:pointer; font:inherit; font-size:13.5px; font-weight:600; text-align:left; background:{{ nav.project.bg }}; color:{{ nav.project.fg }}; box-shadow:inset 3px 0 0 {{ nav.project.bar }};">
        <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M8 4h8a1 1 0 0 1 1 1v15a1 1 0 0 1-1 1H8a1 1 0 0 1-1-1V5a1 1 0 0 1 1-1z"/><path d="M9 3h6v3H9z"/><path d="M10 11h4M10 15h4"/></svg>
        案件・条件入力
      </button>
      <button onClick="{{ nav.routes.go }}" style="display:flex; align-items:center; gap:11px; width:100%; padding:10px 18px; border:none; cursor:pointer; font:inherit; font-size:13.5px; font-weight:600; text-align:left; background:{{ nav.routes.bg }}; color:{{ nav.routes.fg }}; box-shadow:inset 3px 0 0 {{ nav.routes.bar }};">
        <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="6" cy="6" r="2.4"/><circle cx="18" cy="18" r="2.4"/><path d="M8 6h7a3 3 0 0 1 0 6H9a3 3 0 0 0 0 6h7"/></svg>
        ルート検討・地図
      </button>
      <button onClick="{{ nav.memo.go }}" style="display:flex; align-items:center; gap:11px; width:100%; padding:10px 18px; border:none; cursor:pointer; font:inherit; font-size:13.5px; font-weight:600; text-align:left; background:{{ nav.memo.bg }}; color:{{ nav.memo.fg }}; box-shadow:inset 3px 0 0 {{ nav.memo.bar }};">
        <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M6 3h9l4 4v14a0 0 0 0 1 0 0H6a1 1 0 0 1-1-1V4a1 1 0 0 1 1-1z"/><path d="M9 13l2 2 4-4"/></svg>
        搬入リスクメモ
      </button>
      <button onClick="{{ nav.report.go }}" style="display:flex; align-items:center; gap:11px; width:100%; padding:10px 18px; border:none; cursor:pointer; font:inherit; font-size:13.5px; font-weight:600; text-align:left; background:{{ nav.report.bg }}; color:{{ nav.report.fg }}; box-shadow:inset 3px 0 0 {{ nav.report.bar }};">
        <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M6 3h12a1 1 0 0 1 1 1v16a1 1 0 0 1-1 1H6a1 1 0 0 1-1-1V4a1 1 0 0 1 1-1z"/><path d="M9 8h6M9 12h6M9 16h3"/></svg>
        レポート出力
      </button>
      <div style="padding:15px 18px 6px; font-size:10.5px; font-weight:700; letter-spacing:.12em; color:#5c636d;">ナレッジ</div>
      <button onClick="{{ nav.knowledge.go }}" style="display:flex; align-items:center; gap:11px; width:100%; padding:10px 18px; border:none; cursor:pointer; font:inherit; font-size:13.5px; font-weight:600; text-align:left; background:{{ nav.knowledge.bg }}; color:{{ nav.knowledge.fg }}; box-shadow:inset 3px 0 0 {{ nav.knowledge.bar }};">
        <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="10" cy="10" r="6"/><path d="M19 19l-4.5-4.5"/><path d="M10 6.5l.7 1.8 1.8.7-1.8.7L10 11.5l-.7-1.8L7.5 9l1.8-.7z" fill="currentColor" stroke="none"/></svg>
        ナレッジ検索 <span style="margin-left:auto; font-size:9px; font-family:'Space Grotesk',sans-serif; font-weight:700; color:#15181c; background:#ff6a00; border-radius:3px; padding:1.5px 5px;">AI</span>
      </button>
      <button onClick="{{ nav.facilities.go }}" style="display:flex; align-items:center; gap:11px; width:100%; padding:10px 18px; border:none; cursor:pointer; font:inherit; font-size:13.5px; font-weight:600; text-align:left; background:{{ nav.facilities.bg }}; color:{{ nav.facilities.fg }}; box-shadow:inset 3px 0 0 {{ nav.facilities.bar }};">
        <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M12 21s-7-5-7-11a7 7 0 0 1 14 0c0 6-7 11-7 11z"/><circle cx="12" cy="10" r="2.2"/></svg>
        周辺施設辞書
      </button>

      <div style="padding:15px 18px 6px; font-size:10.5px; font-weight:700; letter-spacing:.12em; color:#5c636d;">管理</div>
      <button onClick="{{ nav.admin.go }}" style="display:flex; align-items:center; gap:11px; width:100%; padding:10px 18px; border:none; cursor:pointer; font:inherit; font-size:13.5px; font-weight:600; text-align:left; background:{{ nav.admin.bg }}; color:{{ nav.admin.fg }}; box-shadow:inset 3px 0 0 {{ nav.admin.bar }};">
        <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M4 7h10M18 7h2M4 17h2M10 17h10"/><circle cx="16" cy="7" r="2.2"/><circle cx="8" cy="17" r="2.2"/></svg>
        管理設定
      </button>
      <button onClick="{{ nav.system.go }}" style="display:flex; align-items:center; gap:11px; width:100%; padding:10px 18px; border:none; cursor:pointer; font:inherit; font-size:13.5px; font-weight:600; text-align:left; background:{{ nav.system.bg }}; color:{{ nav.system.fg }}; box-shadow:inset 3px 0 0 {{ nav.system.bar }};">
        <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="12" r="3.2"/><path d="M12 3v2.5M12 18.5V21M3 12h2.5M18.5 12H21M5.6 5.6l1.8 1.8M16.6 16.6l1.8 1.8M18.4 5.6l-1.8 1.8M7.4 16.6l-1.8 1.8"/></svg>
        システム設定
      </button>
    </nav>

    <div style="padding:12px 18px; border-top:1px solid #23282f; font-size:10.5px; color:#6b727c; line-height:1.6;">
      <span style="font-weight:700; color:#ff8a3d;">本番利用禁止（PoC）</span> · 公開データ初期検討<br>
      <span style="font-family:'JetBrains Mono',monospace; color:#565d66;">v0.1 — 社内評価環境</span>
    </div>
  </aside>

  <div style="flex:1; display:flex; flex-direction:column; min-width:0;">

    <header style="height:58px; flex:none; background:#1a1d21; border-bottom:1px solid #2c323a; display:flex; align-items:center; justify-content:space-between; padding:0 22px; color:#e6e9ed;">
      <div style="display:flex; align-items:center; gap:13px; min-width:0;">
        <span style="font-size:12px; color:#828a94;">対象案件</span>
        <div style="display:flex; align-items:center; gap:9px; background:#23272d; border:1px solid #333a42; padding:6px 12px; border-radius:6px; cursor:pointer; min-width:0;">
          <span style="font-family:'JetBrains Mono',monospace; font-size:11px; color:#8a93a0;">PRJ-2418</span>
          <span style="font-weight:600; font-size:13.5px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;">第二期 護岸ブロック据付</span>
          <span style="flex:none; padding:2px 7px; border-radius:3px; font-size:10.5px; font-weight:600; background:#3a2419; color:#ff8a3d; border:1px solid #5a3115;">追加確認中</span>
          <span style="color:#828a94; font-size:11px;">▾</span>
        </div>
      </div>
      <div style="display:flex; align-items:center; gap:20px; flex:none;">
        <span style="font-family:'JetBrains Mono',monospace; font-size:12.5px; color:#aab2bc;">2026/06/19 (木) 09:42</span>
        <div style="display:flex; align-items:center; gap:9px;">
          <div style="width:32px; height:32px; border-radius:50%; background:#2b6cb0; border:1.5px solid #4b89cc; display:flex; align-items:center; justify-content:center; font-size:12px; font-weight:700; color:#fff; font-family:'Space Grotesk',sans-serif;">中村</div>
          <div style="line-height:1.25;">
            <div style="font-size:12.5px; font-weight:600;">中村 健三</div>
            <div style="font-size:10.5px; color:#828a94;">施工計画担当</div>
          </div>
        </div>
      </div>
    </header>

    <div style="flex:none; background:#fef3d4; border-bottom:1.5px solid #ecd28a; display:flex; align-items:stretch;">
      <div style="width:42px; flex:none; background-image:repeating-linear-gradient(45deg,#1a1d21 0 9px,#ffc400 9px 18px);"></div>
      <div style="display:flex; align-items:center; gap:10px; padding:8px 16px; font-size:12px; color:#5a4a16; line-height:1.45;">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#a4761a" stroke-width="2" style="flex:none;"><path d="M12 3 L22 20 H2 Z"/><path d="M12 10v5M12 17.5v.5"/></svg>
        <span><b>【PoC・サンプル】本番利用禁止。</b>表示中のルート、橋梁・トンネル・学校・病院・交通量・災害リスクなどの地物はサンプル生成であり、実データではありません。本番計画・通行可否・許認可の判断には使用せず、道路管理者・警察・発注者・協力会社・現地確認による追加確認を前提としてください。</span>
      </div>
    </div>

    <div style="flex:1; overflow-y:auto; min-height:0;">

      <sc-if value="{{ isDashboard }}" hint-placeholder-val="{{ true }}">
      <section data-screen-label="ダッシュボード" style="padding:26px 30px 44px; max-width:1340px;">
        <div style="display:flex; align-items:flex-end; justify-content:space-between; gap:20px; margin-bottom:22px; flex-wrap:wrap;">
          <div>
            <div style="font-family:'Space Grotesk',sans-serif; font-size:11.5px; font-weight:600; letter-spacing:.16em; color:#8a8f98;">DASHBOARD</div>
            <h1 style="margin:5px 0 0; font-size:25px; font-weight:700; letter-spacing:.01em;">搬入ルート検討 ダッシュボード</h1>
            <div style="margin-top:6px; font-size:13px; color:#5e646c;">最近の案件、要確認件数、公開データソースの接続状態を確認できます。</div>
          </div>
          <div style="display:flex; gap:10px;">
            <button style="display:flex; align-items:center; gap:7px; padding:10px 15px; background:#fff; border:1.5px solid #c9c4ba; border-radius:6px; font:inherit; font-size:13px; font-weight:600; color:#2a2e34; cursor:pointer;" style-hover="border-color:#9a958b;">
              <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg>
              案件を検索
            </button>
            <button onClick="{{ newProject }}" style="display:flex; align-items:center; gap:7px; padding:10px 16px; background:{{ accent }}; border:1.5px solid {{ accent }}; border-radius:6px; font:inherit; font-size:13px; font-weight:700; color:#fff; cursor:pointer; box-shadow:0 2px 6px rgba(0,0,0,0.18);" style-hover="background:#f26200;">
              ＋ 新規案件を作成
            </button>
          </div>
        </div>

        <div style="display:grid; grid-template-columns:repeat(4,1fr); gap:16px; margin-bottom:18px;">
          <sc-for list="{{ stats }}" as="s" hint-placeholder-count="4">
            <div style="background:#fff; border:1.5px solid #d8d4cc; border-radius:6px; display:flex; overflow:hidden;">
              <div style="width:5px; flex:none; background:{{ s.color }};"></div>
              <div style="padding:15px 17px; flex:1;">
                <div style="font-size:12px; font-weight:600; color:#6b7079;">{{ s.label }}</div>
                <div style="font-family:'Space Grotesk',sans-serif; font-size:33px; font-weight:700; line-height:1.05; margin-top:7px; font-variant-numeric:tabular-nums;">{{ s.value }}<span style="font-size:15px; color:#a0a5ac; margin-left:3px; font-weight:600;">{{ s.unit }}</span></div>
                <div style="font-size:11.5px; color:#8a8f98; margin-top:6px;">{{ s.note }}</div>
              </div>
            </div>
          </sc-for>
        </div>

        <div style="display:grid; grid-template-columns:1.62fr 1fr; gap:18px; align-items:start;">
          <div style="background:#fff; border:1.5px solid #d8d4cc; border-radius:6px; overflow:hidden;">
            <div style="display:flex; align-items:center; justify-content:space-between; padding:14px 18px; border-bottom:1.5px solid #ece9e2;">
              <div style="font-weight:700; font-size:14.5px;">最近の案件</div>
              <span style="font-size:12px; color:#8a8f98;">全 12 件中 6 件</span>
            </div>
            <div style="display:grid; grid-template-columns:1fr 86px 56px 50px 60px 22px; gap:8px; padding:9px 18px; background:#f6f4ef; border-bottom:1px solid #ece9e2; font-size:11px; font-weight:700; color:#7c828c; letter-spacing:.02em;">
              <div>案件名 / 現場</div><div>状態</div><div style="text-align:right;">要確認</div><div style="text-align:right;">不足</div><div style="text-align:right;">更新</div><div></div>
            </div>
            <sc-for list="{{ projects }}" as="p" hint-placeholder-count="6">
              <div onClick="{{ p.onClick }}" style="display:grid; grid-template-columns:1fr 86px 56px 50px 60px 22px; gap:8px; align-items:center; padding:12px 18px; border-bottom:1px solid #f0ede7; cursor:pointer;" style-hover="background:#faf8f3;">
                <div style="min-width:0;">
                  <div style="font-weight:600; font-size:13.5px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;">{{ p.name }}</div>
                  <div style="font-size:11px; color:#959aa1; margin-top:2px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;"><span style="font-family:'JetBrains Mono',monospace;">{{ p.id }}</span> · {{ p.site }}</div>
                </div>
                <div><span style="display:inline-block; padding:3px 8px; border-radius:3px; font-size:11px; font-weight:600; background:{{ p.sBg }}; color:{{ p.sColor }}; border:1px solid {{ p.sBorder }};">{{ p.sLabel }}</span></div>
                <div style="text-align:right; font-family:'JetBrains Mono',monospace; font-weight:700; font-size:13px; color:{{ p.confirmColor }};">{{ p.confirm }}</div>
                <div style="text-align:right; font-family:'JetBrains Mono',monospace; font-size:13px; color:#7c828c;">{{ p.data }}</div>
                <div style="text-align:right; font-size:11px; color:#9aa0a7; font-family:'JetBrains Mono',monospace;">{{ p.updated }}</div>
                <div style="text-align:right; color:#bdb8ad; font-size:16px;">›</div>
              </div>
            </sc-for>
          </div>

          <div style="display:flex; flex-direction:column; gap:18px;">
            <div style="background:#fff; border:1.5px solid #d8d4cc; border-radius:6px; overflow:hidden;">
              <div style="padding:13px 16px; border-bottom:1.5px solid #ece9e2; font-weight:700; font-size:14px;">データソース接続状態</div>
              <sc-for list="{{ dataSources }}" as="d" hint-placeholder-count="5">
                <div style="display:flex; align-items:center; gap:10px; padding:10px 16px; border-bottom:1px solid #f0ede7;">
                  <span style="width:9px; height:9px; border-radius:50%; flex:none; background:{{ d.dotColor }}; box-shadow:0 0 0 3px {{ d.dotHalo }};"></span>
                  <div style="flex:1; min-width:0;">
                    <div style="font-size:12.5px; font-weight:600; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;">{{ d.name }}</div>
                    <div style="font-size:10.5px; color:#9aa0a7; font-family:'JetBrains Mono',monospace; margin-top:1px;">{{ d.freq }} · {{ d.checked }}</div>
                  </div>
                  <span style="flex:none; font-size:10.5px; font-weight:700; padding:2px 6px; border-radius:3px; background:{{ d.rankBg }}; color:{{ d.rankColor }};">{{ d.rankLabel }}</span>
                  <span style="flex:none; font-size:11.5px; font-weight:600; color:{{ d.statusColor }}; min-width:30px; text-align:right;">{{ d.statusLabel }}</span>
                </div>
              </sc-for>
            </div>

            <div style="background:#fff; border:1.5px solid #d8d4cc; border-radius:6px; overflow:hidden;">
              <div style="padding:13px 16px; border-bottom:1.5px solid #ece9e2; font-weight:700; font-size:14px;">注意箇所の種別内訳<span style="font-weight:500; font-size:11px; color:#9aa0a7; margin-left:6px;">直近30日</span></div>
              <div style="padding:13px 16px; display:flex; flex-direction:column; gap:9px;">
                <sc-for list="{{ hazardBreakdown }}" as="h" hint-placeholder-count="6">
                  <div style="display:flex; align-items:center; gap:10px;">
                    <span style="width:78px; flex:none; font-size:11.5px; color:#5e646c;">{{ h.label }}</span>
                    <div style="flex:1; height:9px; background:#efece6; border-radius:5px; overflow:hidden;"><div style="height:100%; width:{{ h.pct }}; background:{{ h.color }}; border-radius:5px;"></div></div>
                    <span style="width:20px; flex:none; text-align:right; font-family:'JetBrains Mono',monospace; font-size:12px; font-weight:600;">{{ h.n }}</span>
                  </div>
                </sc-for>
              </div>
            </div>

            <div style="background:#fff; border:1.5px solid #d8d4cc; border-radius:6px; overflow:hidden;">
              <div style="padding:13px 16px; border-bottom:1.5px solid #ece9e2; font-weight:700; font-size:14px;">最近更新された注意地点</div>
              <sc-for list="{{ knowledgePoints }}" as="k" hint-placeholder-count="4">
                <div style="display:flex; align-items:center; gap:11px; padding:10px 16px; border-bottom:1px solid #f0ede7;">
                  <span style="width:26px; height:26px; flex:none; border-radius:6px; background:{{ k.color }}; color:#fff; display:flex; align-items:center; justify-content:center; font-size:12.5px; font-weight:700;">{{ k.k }}</span>
                  <div style="flex:1; min-width:0;">
                    <div style="font-size:12.5px; font-weight:600; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;">{{ k.name }}</div>
                    <div style="font-size:10.5px; color:#9aa0a7; font-family:'JetBrains Mono',monospace;">更新 {{ k.date }}</div>
                  </div>
                  <span style="flex:none; font-size:10.5px; font-weight:700; padding:2px 6px; border-radius:3px; background:{{ k.rankBg }}; color:{{ k.rankColor }};">{{ k.rankLabel }}</span>
                </div>
              </sc-for>
            </div>
          </div>
        </div>
      </section>
      </sc-if>

      <sc-if value="{{ isProject }}" hint-placeholder-val="{{ true }}">
      <section data-screen-label="案件・条件入力" style="padding:26px 30px 48px; max-width:1280px;">
        <div style="display:flex; align-items:flex-end; justify-content:space-between; gap:20px; margin-bottom:20px; flex-wrap:wrap;">
          <div>
            <div style="font-family:'Space Grotesk',sans-serif; font-size:11.5px; font-weight:600; letter-spacing:.16em; color:#8a8f98;">PROJECT &amp; CONDITIONS</div>
            <h1 style="margin:5px 0 0; font-size:24px; font-weight:700;">案件・搬入条件の入力</h1>
            <div style="margin-top:6px; font-size:13px; color:#5e646c;"><span style="font-family:'JetBrains Mono',monospace; color:#9aa0a7;">PRJ-2418</span> · 入力後にルート候補を生成します。空欄の条件は「データ不足／追加確認」として扱われます。</div>
          </div>
          <div style="display:flex; gap:10px;">

                  <div onClick="{{ t.onToggle }}" style="display:flex; align-items:center; gap:12px; padding:11px 0; cursor:pointer;">
                    <div style="flex:1;"><div style="font-size:13px; font-weight:600; color:#3a3f46;">{{ t.label }}</div><div style="font-size:11px; color:#9aa0a7; margin-top:2px;">{{ t.note }}</div></div>
                    <span style="width:38px; height:21px; flex:none; border-radius:11px; background:{{ t.trackBg }}; position:relative;"><span style="position:absolute; top:2px; left:{{ t.knobX }}; width:17px; height:17px; border-radius:50%; background:#fff; box-shadow:0 1px 2px rgba(0,0,0,.25);"></span></span>
                  </div>
                </sc-for>
              </div>
            </div>

            <div style="background:#fff; border:1.5px solid #d8d4cc; border-radius:8px; overflow:hidden;">
              <div style="padding:13px 18px; border-bottom:1.5px solid #ece9e2; display:flex; align-items:center; gap:8px;">
                <span style="font-weight:700; font-size:14px;">API・外部連携</span>
                <span style="font-size:9.5px; font-family:'Space Grotesk',sans-serif; font-weight:700; color:#15181c; background:{{ accent }}; border-radius:3px; padding:1.5px 5px;">AI</span>
              </div>
              <div style="padding:15px 18px;">
                <div style="font-size:12px; color:#6b7079; line-height:1.55; margin-bottom:13px;">ナレッジ検索のAI回答に使用する <b>Perplexity API</b> のキー。フロントエンドには露出せず Secrets に保存され、マスク表示されます。</div>
                <label style="display:block; font-size:11.5px; font-weight:600; color:#6b7079;">Perplexity API キー</label>
                <div style="margin-top:6px; display:flex; gap:8px;">
                  <input type="password" value="{{ apiKey }}" onInput="{{ onApiInput }}" placeholder="pplx-xxxxxxxxxxxxxxxxxxxx" style="flex:1; padding:9px 11px; border:1.5px solid #d4cfc4; border-radius:7px; font:inherit; font-size:12.5px; font-family:'JetBrains Mono',monospace; outline:none; letter-spacing:.04em;">
                </div>
                <div style="margin-top:9px; display:flex; align-items:center; gap:8px;">
                  <span style="width:8px; height:8px; border-radius:50%; flex:none; background:{{ apiStatusDot }};"></span>
                  <sc-if value="{{ apiTesting }}" hint-placeholder-val="{{ false }}"><span style="width:13px; height:13px; border:2px solid #e0dccf; border-top-color:#2b6cb0; border-radius:50%; display:inline-block; animation:spin .7s linear infinite;"></span></sc-if>
                  <span style="font-size:12px; font-weight:600; color:{{ apiStatusColor }};">{{ apiStatusLabel }}</span>
                </div>
                <div style="margin-top:14px; display:flex; gap:9px; align-items:center;">
                  <button onClick="{{ testApi }}" style="display:flex; align-items:center; gap:6px; padding:9px 14px; background:#fff; border:1.5px solid #c9c4ba; border-radius:7px; font:inherit; font-size:12.5px; font-weight:600; color:#2a2e34; cursor:pointer;" style-hover="border-color:#9a958b;">
                    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M5 12l4 4 10-10"/></svg>
                    接続テスト
                  </button>
                  <button onClick="{{ saveApi }}" style="display:flex; align-items:center; gap:6px; padding:9px 16px; background:{{ accent }}; border:none; border-radius:7px; font:inherit; font-size:12.5px; font-weight:700; color:#fff; cursor:pointer; box-shadow:0 2px 6px rgba(0,0,0,0.18);" style-hover="filter:brightness(1.05);">設定を保存</button>
                  <sc-if value="{{ apiSaved }}" hint-placeholder-val="{{ false }}"><span style="font-size:12px; font-weight:600; color:#1f8a4c;">保存しました ✓</span></sc-if>
                </div>
                <div style="margin-top:13px; font-size:11px; color:#9aa0a7; line-height:1.55;">キーの変更・保存は監査ログに記録されます。利用条件・レート制限は提供元の規約に従います。</div>
              </div>
            </div>

            <div style="background:#fff; border:1.5px solid #d8d4cc; border-radius:8px; overflow:hidden;">
              <div style="padding:13px 18px; border-bottom:1.5px solid #ece9e2; font-weight:700; font-size:14px;">バックアップ</div>
              <div style="padding:14px 18px; display:flex; flex-direction:column; gap:11px;">
                <div style="display:flex; align-items:center; justify-content:space-between;"><span style="font-size:13px; color:#3a3f46;">日次バックアップ</span><span style="font-size:11.5px; font-weight:700; color:#1f8a4c;">有効 · 02:00 JST</span></div>
                <button style="width:100%; padding:10px; background:#fff; border:1.5px solid #c9c4ba; border-radius:7px; font:inherit; font-size:12.5px; font-weight:600; color:#2a2e34; cursor:pointer;" style-hover="border-color:#9a958b;">評価ルール設定をエクスポート</button>
              </div>
            </div>
          </div>
        </div>
      </section>
      </sc-if>

    </div>
  </div>
</div>
  </template>
  <script src="/assets/vendor/leaflet/leaflet.js"></script>
  <script src="/assets/dc-runtime.js"></script>
  <script src="/assets/component.js"></script>
  <script src="/assets/app.js"></script>
</body>
</html>
